name: Remote App Builder

on:
  workflow_dispatch:
    inputs:
      app_folder:
        description: 'App-Ordner in neoos-apps (z.B. apps/com.neoos.app.neocast)'
        required: true
        default: 'apps/com.neoos.app.neocast'

jobs:
  remote-build-and-release:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ Checkout Control Repo (mr-yaml)
      - name: Checkout Control Repo
        uses: actions/checkout@v4
        with:
          repository: NeoOS-TV/mr-yaml
          path: control-repo

      # 2️⃣ Checkout App Repo (neoos-apps)
      - name: Checkout App Repo
        uses: actions/checkout@v4
        with:
          repository: NeoOS-TV/neoos-apps
          path: app-repo

      # 3️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4️⃣ Install webOS CLI
      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      # 5️⃣ Read app info & prepare IPK
      - name: Prepare webOS App
        id: build
        run: |
          FOLDER="${{ github.event.inputs.app_folder }}"

          if [ ! -f "$FOLDER/appinfo.json" ]; then
            echo "::error::Keine appinfo.json im angegebenen Ordner gefunden!"
            exit 1
          fi

          APP_ID=$(jq -r '.id' "$FOLDER/appinfo.json")
          APP_TITLE=$(jq -r '.title' "$FOLDER/appinfo.json")
          APP_VERSION=$(jq -r '.version' "$FOLDER/appinfo.json")

          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "app_title=$APP_TITLE" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          # Temporäre Release Assets vorbereiten
          mkdir -p /tmp/release-assets

          # Icon kopieren, falls temporär hochgeladen
          if [ -f "control-repo/tmp_upload_icon.png" ]; then
            cp control-repo/tmp_upload_icon.png "$FOLDER/icon.png"
            cp control-repo/tmp_upload_icon.png /tmp/release-assets/icon.png
          else
            cp "$FOLDER/icon.png" /tmp/release-assets/icon.png || touch /tmp/release-assets/icon.png
          fi

          # App paketieren
          cd app-repo
          ares-package "$FOLDER"

          EXPECTED_IPK="${APP_ID}_${APP_VERSION}_all.ipk"
          if [ -f "$EXPECTED_IPK" ]; then
            mv "$EXPECTED_IPK" /tmp/release-assets/
          else
            echo "::error::Die IPK-Datei $EXPECTED_IPK wurde nicht erzeugt!"
            exit 1
          fi

      # 6️⃣ Create Git tag with slash
      - name: Tag & Push Release
        env:
          APP_ID: ${{ steps.build.outputs.app_id }}
          APP_VERSION: ${{ steps.build.outputs.app_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${APP_ID}/${APP_VERSION}"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Tag erstellen falls nicht existent
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          # Push Tag mit Slash korrekt
          git push origin "refs/tags/$TAG"

      # 7️⃣ Cleanup temporäre Datei
      - name: Cleanup temp icon
        run: |
          FILE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/NeoOS-TV/mr-yaml/contents/tmp_upload_icon.png)

          SHA=$(echo "$FILE_INFO" | jq -r '.sha')
          if [ "$SHA" != "null" ] && [ -n "$SHA" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/NeoOS-TV/mr-yaml/contents/tmp_upload_icon.png \
              -d "{\"message\":\"chore: Temporäres Icon nach Build entfernt [skip ci]\",\"sha\":\"$SHA\"}"
          fi
