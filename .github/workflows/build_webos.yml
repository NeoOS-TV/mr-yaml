name: Remote App Builder

on:
  workflow_dispatch:
    inputs:
      app_folder:
        description: 'App-Ordner in neoos-apps'
        required: true
        default: 'apps/com.neoos.app.neocast'

jobs:
  remote-build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mr-yaml
        uses: actions/checkout@v4
        with:
          repository: NeoOS-TV/mr-yaml
          path: control-repo

      - name: Checkout neoos-apps
        uses: actions/checkout@v4
        with:
          repository: NeoOS-TV/neoos-apps
          path: app-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Build App
        id: build
        run: |
          FOLDER="${{ github.event.inputs.app_folder }}"
          if [ ! -f "$FOLDER/appinfo.json" ]; then
            echo "::error::Keine appinfo.json im Ordner $FOLDER gefunden!"
            exit 1
          fi

          APP_ID=$(jq -r '.id' "$FOLDER/appinfo.json")
          APP_VERSION=$(jq -r '.version' "$FOLDER/appinfo.json")
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          mkdir -p /tmp/release-assets

          # Temporäres Icon kopieren
          if [ -f "control-repo/tmp_upload_icon.png" ]; then
            cp control-repo/tmp_upload_icon.png "$FOLDER/icon.png"
            cp control-repo/tmp_upload_icon.png /tmp/release-assets/icon.png
          else
            cp "$FOLDER/icon.png" /tmp/release-assets/icon.png || touch /tmp/release-assets/icon.png
          fi

          echo "📦 Verpacke webOS App-Version..."
          cd app-repo
          ares-package "$FOLDER"
          EXPECTED_IPK="${APP_ID}_${APP_VERSION}_all.ipk"
          if [ ! -f "$EXPECTED_IPK" ]; then
            echo "::error::Die IPK-Datei $EXPECTED_IPK wurde nicht erzeugt!"
            exit 1
          fi
          mv "$EXPECTED_IPK" /tmp/release-assets/

      - name: Tag & Push Release
        env:
          NEOTOKEN: ${{ secrets.NEOTOKEN }}
          APP_ID: ${{ steps.build.outputs.app_id }}
          APP_VERSION: ${{ steps.build.outputs.app_version }}
        run: |
          cd app-repo
          TAG="${APP_ID}/${APP_VERSION}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          git push https://${NEOTOKEN}@github.com/NeoOS-TV/neoos-apps.git refs/tags/$TAG

      - name: Clean up temporary icon
        run: |
          curl -s -H "Authorization: token ${{ secrets.NEOTOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               -X DELETE \
               -d "{\"message\":\"chore: Temporäres Icon nach Build entfernt\",\"sha\":$(curl -s -H "Authorization: token ${{ secrets.NEOTOKEN }}" \
                 -H "Accept: application/vnd.github+json" \
                 https://api.github.com/repos/NeoOS-TV/mr-yaml/contents/tmp_upload_icon.png | jq -r '.sha')}" \
               https://api.github.com/repos/NeoOS-TV/mr-yaml/contents/tmp_upload_icon.png
